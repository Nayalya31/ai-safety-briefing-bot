name: ai-safety-briefing

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: safety_briefing
      POSTGRES_USER: safety_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_development_only}
    volumes:
      - safety_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safety_app -d safety_briefing"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks: [backend]

  db-access:
    image: alpine/socat:1.8.0.3
    command: ["TCP-LISTEN:5432,fork,reuseaddr", "TCP:db:5432"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks: [backend, access]

  db-gateway:
    image: alpine/socat:1.8.0.3
    command: ["TCP-LISTEN:5432,fork,reuseaddr", "TCP:db-access:5432"]
    ports:
      - "127.0.0.1:55432:5432"
    depends_on:
      - db-access
    restart: unless-stopped
    networks: [access]

  bot:
    build: .
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://safety_app:${POSTGRES_PASSWORD:-local_development_only}@db:5432/safety_briefing
      MATERIALS_DIR: /app/materials
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks: [backend, egress]

networks:
  backend:
    internal: true
  access:
  egress:

volumes:
  safety_postgres_data:
