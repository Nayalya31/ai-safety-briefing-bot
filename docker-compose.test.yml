name: ai-safety-briefing-test

services:
  test-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: safety_test
      POSTGRES_USER: safety_test
      POSTGRES_PASSWORD: safety_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safety_test -d safety_test"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "127.0.0.1:55432:5432"
